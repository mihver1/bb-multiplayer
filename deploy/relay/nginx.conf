# Loaded inside nginx's existing http {} via sites-enabled.
# Unique zones and server_name; no changes to existing sites or global limits.
limit_req_zone $binary_remote_addr zone=bb_mp_api:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bb_mp_join:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=bb_mp_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name multiplayer.selfhost.ru;
    access_log off;
    # A fixed host avoids reflecting an attacker-controlled Host header.
    return 308 https://multiplayer.selfhost.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name multiplayer.selfhost.ru;

    # Existing managed wildcard certificate, read-only reuse. Never copy keys.
    ssl_certificate /etc/nginx/ssl/*.selfhost.ru_selfhost.ru_P256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.selfhost.ru_selfhost.ru_P256/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 30s;
    limit_conn bb_mp_conn 32;
    limit_req_status 429;
    limit_conn_status 429;

    # Avoid logging credentials, invite bodies, or attacker-controlled query args.
    access_log off;
    error_log /var/log/nginx/multiplayer-error.log warn;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host multiplayer.selfhost.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
    proxy_redirect off;

    location = / {
        default_type text/html;
        add_header Cache-Control no-store;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        return 200 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BB Multiplayer Playground</title><main><h1>BB Multiplayer Playground</h1><p>The collaboration relay is online.</p><p>Connect from the Multiplayer plugin in your own BB using <code>https://multiplayer.selfhost.ru</code> and a private invitation or member credential.</p><p>No conversations are public. This is an experimental playground, not a standalone chat app.</p><p><a href="/health">Service health</a></p></main></html>';
    }

    location = /health {
        limit_req zone=bb_mp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4789;
    }

    location = /v1/join {
        limit_req zone=bb_mp_join burst=5 nodelay;
        proxy_pass http://127.0.0.1:4789;
    }

    location ^~ /v1/ {
        limit_req zone=bb_mp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4789;
    }

    location / {
        return 404;
    }
}
