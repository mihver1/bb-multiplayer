name: bb-multiplayer-playground
services:
  relay:
    image: bb-multiplayer-relay:0.4.1
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 96
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:4789:4789"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    environment:
      MULTIPLAYER_ROOM_NAME: "Multiplayer Playground"
      MULTIPLAYER_OWNER_NAME: "Mikhail"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4789/health',{signal:AbortSignal.timeout(3000)}).then(async r=>{const d=await r.json();if(!r.ok||d.protocol!==1)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
